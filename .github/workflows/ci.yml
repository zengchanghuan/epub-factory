name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (与生产同 Python/依赖/epubcheck)
        run: docker build -t epub-factory:ci .

      - name: Run offline regression in container
        # 在与生产一致的镜像里跑回归，挡住「依赖/Python/翻译逻辑」漂移。
        # 排除项及原因：
        #   - c4_bilingual / c6_glossary_rag：需真实 LLM 调用与外网，CI 无密钥
        #   - d1_celery_bootstrap / d4_celery_job_pipeline：依赖 Redis broker
        run: |
          docker run --rm \
            -e OPENAI_API_KEY=dummy \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e SENTRY_DSN= \
            -e SKIP_PAYMENT_CHECK=1 \
            epub-factory:ci \
            bash -lc '
              set -e
              SUITE="
                test_d2_task_data_models
                test_d3_api_v2_skeleton
                test_d5_stage_events
                test_d6_manifest
                test_d7_translate_chapter
                test_d8_reduce
                test_d9_book_reduce
                test_d10_status_resolver
                test_d11_notifications
                test_d12_translation_enhancement
                test_d13_regression
                test_d14_fast_translation_runner
                test_d15_translation_quality_audit
                test_d16_translation_qa_service
                test_d17_batch_conversion
                test_d20_checkout_webhook
                test_d19_order_admin
                test_d18_paid_translation_regression
                test_d20_translation_confirmation
                test_d21_real_order_recovery
                test_d23_flash_alias
                test_d29_translation_performance
                test_d30_corpus_fixes
                test_d31_input_integrity
                test_d31_epub_validation
                test_d31_reduce_index
                test_d32_resource_repair
                test_d32_source_warning_flow
                test_d32_literal_code_preservation
                test_c1_typography_and_fallback
                test_c2_pipeline_metrics
                test_c3_stem_guard
                test_c5_persistent_store
              "
              fail=0
              for t in $SUITE; do
                echo "=== $t ==="
                python "$t.py" || fail=1
              done
              exit $fail
            '
