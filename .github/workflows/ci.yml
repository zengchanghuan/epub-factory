name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend regression
        run: |
          for test in frontend/tests/test_*.js; do
            node frontend/tests/runner.js "$(basename "$test")" || exit 1
          done
      - name: Check static tool pages cannot regenerate checkout copies
        run: |
          python3 scripts/test_tool_landing.py
          python3 scripts/generate_seo_pages.py --check
      - name: Exercise unified tool entries in isolated Chrome
        # Hosted ubuntu runner Chrome; all APIs/payment are loopback fixtures.
        # No npm install, production credentials or customer files are used.
        env:
          CHROME_BIN: google-chrome
        run: node scripts/test_tool_entry_browser.cjs

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (与生产同 Python/依赖/epubcheck)
        run: docker build -t epub-factory:ci .

      - name: Run offline regression in container
        # 在与生产一致的镜像里跑回归，挡住「依赖/Python/翻译逻辑」漂移。
        # 排除项及原因：
        #   - c4_bilingual / c6_glossary_rag：需真实 LLM 调用与外网，CI 无密钥
        #   - d1_celery_bootstrap / d4_celery_job_pipeline：依赖 Redis broker
        run: |
          docker run --rm \
            -e OPENAI_API_KEY=dummy \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e SENTRY_DSN= \
            -e SKIP_PAYMENT_CHECK=1 \
            epub-factory:ci \
            bash -lc '
              set -e
              SUITE="
                test_d2_task_data_models
                test_d3_api_v2_skeleton
                test_d5_stage_events
                test_d6_manifest
                test_d7_translate_chapter
                test_d8_reduce
                test_d9_book_reduce
                test_d10_status_resolver
                test_d11_notifications
                test_d12_translation_enhancement
                test_d13_regression
                test_d14_fast_translation_runner
                test_d15_translation_quality_audit
                test_d16_translation_qa_service
                test_d17_batch_conversion
                test_d20_checkout_webhook
                test_d19_order_admin
                test_d18_paid_translation_regression
                test_d20_translation_confirmation
                test_d21_real_order_recovery
                test_d23_flash_alias
                test_d29_translation_performance
                test_d30_corpus_fixes
                test_d31_input_integrity
                test_d31_epub_validation
                test_d31_reduce_index
                test_d32_resource_repair
                test_d32_source_warning_flow
                test_d32_literal_code_preservation
                test_d33_repair_pricing
                test_d34_completion_email
                test_d34_email_api
                test_d35_payment_email
                test_d35_payment_hooks
                test_d35_payment_reconcile
                test_d36_alipay_verification
                test_d36_repair_checkout
                test_d37_payment_entitlement
                test_d38_navigation_compat
                test_d38_navigation_packaging
                test_d39_table_compat
                test_d40_reduce_isolation
                test_d40_rescue_identity
                test_d41_precision_polish
                test_d41_precision_contract
                test_d42_translation_input
                test_d42_translation_contract
                test_d43_dispatch_store
                test_d43_dispatch_service
                test_d43_dispatch_publisher
                test_d43_dispatch_contract
                test_d43_dispatch_execution
                test_d44_alipay_close
                test_d44_payment_lifecycle_store
                test_d44_payment_lifecycle_contract
                test_d44_payment_reconcile
                test_d45_execution_store
                test_d45_execution_runtime
                test_d45_recovery_service
                test_d45_worker_process
                test_d45_execution_resume
                test_d45_worker_db
                test_d45_unstarted_dispatch
                test_d46_write_fence_store
                test_d46_write_fence_contract
                test_d46_execution_fence
                test_d47_queue_routing
                test_d47_queue_process
                test_d47_worker_control
                test_d47_worker_environment
                test_d48_repair_repository
                test_d48_repair_executor
                test_d48_repair_contract
                test_d50_llm_gateway
                test_d50_llm_limiter
                test_d50_llm_callers
                test_d50_preflight_admission
                test_d51_notification_store
                test_d51_notification_api
                test_d51_auth_config
                test_d52_translation_quote
                test_d52_quote_contract
                test_d53_checkout_gateway
                test_d53_checkout_contract
                test_d54_schema_init
                test_c1_typography_and_fallback
                test_c2_pipeline_metrics
                test_c3_stem_guard
                test_c5_persistent_store
              "
              fail=0
              for t in $SUITE; do
                echo "=== $t ==="
                python "$t.py" || fail=1
              done
              python ../scripts/test_configure_email.py || fail=1
              python ../scripts/test_configure_alipay_public_key.py || fail=1
              python ../scripts/test_migrate_legacy_repair.py || fail=1
              python ../scripts/test_deploy_legacy_gate.py || fail=1
              python ../scripts/test_worker_services.py || fail=1
              python ../scripts/test_audit_production_config.py || fail=1
              python ../scripts/test_deploy_lock.py || fail=1
              exit $fail
            '

      - name: Verify quota Lua against actual Redis 6 and 7
        # Production was read-only verified as Redis 6.0.16; compose uses 7.
        # Disposable loopback servers only. No provider calls or customer books.
        run: |
          set -euo pipefail
          cleanup() { docker rm -f fixepub-d54-redis >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for version in 6.0.16 7.2.10; do
            docker run -d --name fixepub-d54-redis \
              -p 127.0.0.1:16379:6379 "redis:$version" \
              redis-server --save '' --appendonly no
            ready=0
            for attempt in $(seq 1 30); do
              if docker exec fixepub-d54-redis redis-cli ping; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
            docker run --rm --network host \
              -e D54_REDIS_ISOLATED=1 \
              -e D54_REDIS_URL=redis://127.0.0.1:16379/0 \
              -e OPENAI_API_KEY=dummy -e SENTRY_DSN= \
              epub-factory:ci python test_d54_redis_integration.py -v
            cleanup
          done
