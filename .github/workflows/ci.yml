name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend regression
        run: |
          for test in frontend/tests/test_*.js; do
            node frontend/tests/runner.js "$(basename "$test")" || exit 1
          done
      - name: Check static tool pages cannot regenerate checkout copies
        run: |
          python3 scripts/test_tool_landing.py
          python3 scripts/generate_seo_pages.py --check
      - name: Exercise unified tool entries in isolated Chrome
        # Hosted ubuntu runner Chrome; all APIs/payment are loopback fixtures.
        # No npm install, production credentials or customer files are used.
        env:
          CHROME_BIN: google-chrome
        run: node scripts/test_tool_entry_browser.cjs

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (与生产同 Python/依赖/epubcheck)
        run: docker build -t epub-factory:ci .

      - name: Run offline regression in container
        # 在与生产一致的镜像里跑回归，挡住「依赖/Python/翻译逻辑」漂移。
        # 与本地读取同一份 D/C 清单。D1/D4/C4/C6 均为离线边界测试。
        # 此容器禁网；实际 Redis 验证保留在下面的独立步骤。
        run: |
          docker run --rm --network none \
            -e OPENAI_API_KEY=dummy \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            -e SENTRY_DSN= \
            -e SKIP_PAYMENT_CHECK=1 \
            epub-factory:ci \
            bash -lc '
              set -e
              SUITE=$(python run_regression.py --list)
              # A fresh synthetic fixture prevents C1/C2/C3 silently doing no work.
              # This is not a customer-book regression; real books stay private/local.
              python ../scripts/prepare-ci-fixture.py --root /app
              fail=0
              for t in $SUITE; do
                echo "=== $t ==="
                python "$t" || fail=1
              done
              python ../scripts/test_configure_email.py || fail=1
              python ../scripts/test_configure_alipay_public_key.py || fail=1
              python ../scripts/test_migrate_legacy_repair.py || fail=1
              python ../scripts/test_deploy_legacy_gate.py || fail=1
              python ../scripts/test_worker_services.py || fail=1
              python ../scripts/test_audit_production_config.py || fail=1
              python ../scripts/test_deploy_lock.py || fail=1
              python ../scripts/test_release_runtime.py || fail=1
              python ../scripts/test_release_gate.py || fail=1
              python ../scripts/test_regression_catalog.py || fail=1
              python ../scripts/test_artifact_retention.py || fail=1
              # Its parser child deliberately uses -I and its own network guard.
              # Keep this diagnostic contract outside the inherited release guard.
              python test_d56_pdf_text_preflight.py || fail=1
              python test_d57_pdf_text_ir.py || fail=1
              python test_d58_pdf_image_assets.py || fail=1
              python test_d58_pdf_reflow.py || fail=1
              python test_d58_pdf_epub_validation.py || fail=1
              python test_d58_pdf_conversion.py || fail=1
              exit $fail
            '

      - name: Verify quota Lua against actual Redis 6 and 7
        # Production was read-only verified as Redis 6.0.16; compose uses 7.
        # Disposable loopback servers only. No provider calls or customer books.
        run: |
          set -euo pipefail
          cleanup() { docker rm -f fixepub-d54-redis >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for version in 6.0.16 7.2.10; do
            docker run -d --name fixepub-d54-redis \
              -p 127.0.0.1:16379:6379 "redis:$version" \
              redis-server --save '' --appendonly no
            ready=0
            for attempt in $(seq 1 30); do
              if docker exec fixepub-d54-redis redis-cli ping; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
            docker run --rm --network host \
              -e D54_REDIS_ISOLATED=1 \
              -e D54_REDIS_URL=redis://127.0.0.1:16379/0 \
              -e OPENAI_API_KEY=dummy -e SENTRY_DSN= \
              epub-factory:ci python test_d54_redis_integration.py -v
            cleanup
          done
